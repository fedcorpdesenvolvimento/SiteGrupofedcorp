          - generic [ref=e184]:
            - paragraph [ref=e185]: Nossa plataforma digital foi desenvolvida para ser o ecossistema de proteção mais completo e intuitivo para o mercado imobiliário. Entendemos que a tranquilidade dos seus clientes é um pilar para a fidelização, e por isso centralizamos em um único ambiente uma gama robusta de seguros essenciais, como o Seguro Conteúdo, Seguro Incêndio e Responsabilidade Civil, todos adaptáveis às necessidades específicas de cada imóvel, seja residencial ou comercial. A contratação é simplificada, eliminando burocracias e permitindo a emissão de apólices em poucos cliques.
            - paragraph [ref=e186]
            - paragraph [ref=e187]: O grande diferencial, no entanto, está no valor agregado das nossas Assistências 24h. Mais do que uma apólice, oferecemos uma solução para os imprevistos do dia a dia. Desde serviços emergenciais de chaveiro, eletricista e encanador, até suporte especializado para reparos em eletrodomésticos, garantimos que seu cliente tenha a quem recorrer a qualquer momento. Para sua administradora, isso se traduz em uma poderosa ferramenta de retenção e em uma nova e consistente fonte de receita, transformando um serviço essencial em um ativo estratégico para o seu negócio.
